services:
  consul:
    image: hashicorp/consul:1.19
    container_name: consul
    command: agent -dev -client=0.0.0.0 -ui
    ports:
      - "8500:8500"
    networks:
      - marketplace

  auth:
    build:
      context: ./auth_service
    container_name: auth
    environment:
      - SERVICE_NAME=auth
      - SERVICE_ID=auth-1
      - PORT=8000
      - CONSUL_HOST=consul
      - CONSUL_PORT=8500
      - JWT_SECRET=change-me-in-production
    depends_on:
      - consul
    networks:
      - marketplace

  catalog-1:
    build:
      context: ./catalog_service
    container_name: catalog-1
    environment:
      - SERVICE_NAME=catalog
      - SERVICE_ID=catalog-1
      - INSTANCE_NAME=catalog-1
      - PORT=8000
      - CONSUL_HOST=consul
      - CONSUL_PORT=8500
    depends_on:
      - consul
    networks:
      - marketplace

  catalog-2:
    build:
      context: ./catalog_service
    container_name: catalog-2
    environment:
      - SERVICE_NAME=catalog
      - SERVICE_ID=catalog-2
      - INSTANCE_NAME=catalog-2
      - PORT=8000
      - CONSUL_HOST=consul
      - CONSUL_PORT=8500
    depends_on:
      - consul
    networks:
      - marketplace

  nginx:
    image: nginx:1.27-alpine
    container_name: nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - auth
      - catalog-1
      - catalog-2
    networks:
      - marketplace

networks:
  marketplace:
    driver: bridge